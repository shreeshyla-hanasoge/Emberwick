name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# A newer push makes an in-flight run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 18 is the floor the published manifest advertises in "engines".
        node: ['18', '20', '22']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      # No install on purpose: the suite imports nothing outside src/ and
      # node:*, so it runs against a bare checkout. Nothing to break, nothing
      # to cache, and no registry outage can turn the tests red.
      - run: npm test

  mutate:
    name: mutation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      # Green tests are not evidence that the tests would NOTICE a regression.
      # This reverts each shipped fix in turn and fails on any the suite misses.
      - run: npm run mutate

  build:
    name: build & package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build:lib
      # "Drawings and profiles cost a core-only user nothing" is checked, not
      # asserted: the core entry is rebuilt without the opt-in entries and must
      # match the shipped one byte for byte. If building them beside the core
      # moves anything in index.js (a chunk split, a renamed binding, a hoisted
      # module), this step is where it shows.
      - name: Core is byte-identical with and without the opt-in entries
        run: |
          EMBERWICK_CORE_ONLY=1 npx vite build --config vite.lib.config.js --outDir dist-core-check
          cmp dist-core-check/index.js dist-lib/index.js
          rm -rf dist-core-check
      - run: npm run build:umd
      - run: npm run pack:lib
      # Catches a tarball whose manifest advertises files the build dropped —
      # the failure mode that ships a 404 to every CDN consumer.
      - run: npm run verify:package
      - run: npm run size
      # Every module in a consumer's graph is evaluated in Node during an SSR
      # build (a host that server-renders runs one). A module-scope reference to
      # window or document would break their PRODUCTION build with a stack
      # trace pointing into node_modules — the library should be the one that
      # notices. Runs against the built package, not src.
      - name: Imports with no DOM (SSR safety)
        run: |
          cd dist-lib
          node --input-type=module -e "
            const core = await import('./index.js')
            if (typeof core.createChart !== 'function') throw new Error('core entry is broken')
            const wc = await import('./webcomponent.js')
            if (typeof wc.register !== 'function') throw new Error('webcomponent entry is broken')
            const dr = await import('./drawings.js')
            if (typeof dr.enableDrawings !== 'function') throw new Error('drawings entry is broken')
            const r = dr.normalizeDrawings([{ type: 'trendLine', points: [{ time: 1, price: '2' }, { time: 2, price: 3 }] }])
            if (r.drawings.length !== 1 || r.report.loaded !== 1) throw new Error('normalizeDrawings is not pure/SSR-safe')
            const pr = await import('./profiles.js')
            if (typeof pr.createVolumeProfile !== 'function') throw new Error('profiles entry is broken')
            const va = pr.computeValueArea([1, 4, 9, 5, 1], 100, 0.5)
            if (!va || va.poc !== 101.25) throw new Error('computeValueArea is not pure/SSR-safe')
            console.log('core, webcomponent, drawings and profiles entries import with no DOM; version', core.version)
          "

      - name: What would be published
        run: npm pack --dry-run ./dist-lib
      - uses: actions/upload-artifact@v7
        with:
          name: dist-lib
          path: dist-lib/
          retention-days: 14
